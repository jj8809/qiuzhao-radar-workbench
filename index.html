<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#4f46e5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="秋招雷达" />
<link rel="manifest" href="manifest.json" />
<title>秋招雷达 · 求职工作台</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2430; --sub:#6b7280;
    --brand:#4f46e5; --brand2:#6366f1;
    --s:#e11d48; --a:#2563eb; --b:#64748b;
    --ok:#16a34a; --line:#e8ebf2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:32px;}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--brand),var(--brand2));
    color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 16px 14px;}
  .h-top{display:flex;align-items:center;justify-content:space-between;}
  .h-title{font-size:20px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
  .h-title .dot{width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
  .h-sub{font-size:12px;opacity:.85;margin-top:2px}
  .refresh{background:rgba(255,255,255,.18);border:0;color:#fff;font-size:12px;
    padding:7px 12px;border-radius:999px;font-weight:600}
  .refresh:active{transform:scale(.96)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 16px 0}
  .stat{background:var(--card);border-radius:14px;padding:10px 6px;text-align:center;box-shadow:0 2px 10px rgba(31,36,48,.05)}
  .stat .n{font-size:19px;font-weight:800}
  .stat .l{font-size:11px;color:var(--sub);margin-top:2px}
  .stat.s .n{color:var(--s)} .stat.ok .n{color:var(--ok)}
  .filters{position:sticky;top:calc(env(safe-area-inset-top) + 96px);z-index:15;
    background:var(--bg);padding:10px 12px 6px;}
  .chip-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .chip{flex:0 0 auto;background:#fff;border:1px solid var(--line);color:var(--sub);
    font-size:12px;padding:6px 12px;border-radius:999px;font-weight:600}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .chip.s.on{background:var(--s);border-color:var(--s)}
  .chip.a.on{background:var(--a);border-color:var(--a)}
  .search{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;
    padding:10px 12px;font-size:14px;margin-top:4px;outline:none}
  .list{padding:4px 12px}
  .card{background:var(--card);border-radius:16px;margin:10px 0;padding:13px 14px 13px 16px;
    position:relative;box-shadow:0 2px 12px rgba(31,36,48,.06);overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
  .card.s::before{background:var(--s)} .card.a::before{background:var(--a)} .card.b::before{background:var(--b)}
  .c-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .c-company{font-size:16px;font-weight:800}
  .badge{font-size:11px;font-weight:800;color:#fff;padding:2px 8px;border-radius:999px;flex:0 0 auto}
  .badge.s{background:var(--s)} .badge.a{background:var(--a)} .badge.b{background:var(--b)}
  .c-role{font-size:14px;color:var(--ink);margin-top:3px;font-weight:600}
  .c-meta{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.5}
  .c-reason{font-size:12px;color:#475569;margin-top:8px;background:#f1f5f9;border-radius:10px;
    padding:8px 10px;line-height:1.55;display:none}
  .c-reason.show{display:block}
  .c-actions{display:flex;gap:8px;margin-top:10px}
  .btn{flex:1;text-align:center;border-radius:10px;padding:9px 0;font-size:13px;font-weight:700;text-decoration:none;display:block}
  .btn.link{background:var(--brand);color:#fff}
  .btn.reason{background:#eef2ff;color:var(--brand);border:0;cursor:pointer}
  .btn:active{opacity:.85}
  .status-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
  .st-未投{background:#fee2e2;color:#b91c1c} .st-已投{background:#dcfce7;color:#15803d}
  .st-面试{background:#fef9c3;color:#a16207}
  .empty{text-align:center;color:var(--sub);padding:40px 20px;font-size:14px}
  .push-bar{position:sticky;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:10px;align-items:center;
    padding-bottom:calc(env(safe-area-inset-bottom) + 10px)}
  .push-bar .t{font-size:12px;color:var(--sub);flex:1;line-height:1.4}
  .push-btn{background:var(--brand);color:#fff;border:0;border-radius:999px;padding:9px 16px;
    font-size:13px;font-weight:700;flex:0 0 auto}
  .push-btn:active{transform:scale(.96)}
  .foot{text-align:center;color:#9aa3b2;font-size:11px;margin-top:18px;line-height:1.6}
  .badge-n{position:absolute;right:14px;top:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="h-top">
      <div>
        <div class="h-title"><span class="dot"></span>秋招雷达</div>
        <div class="h-sub">手机求职工作台 · 数据 <span id="updated">—</span></div>
      </div>
      <button class="refresh" onclick="load(true)">↻ 刷新</button>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="filters">
    <div class="chip-row" id="gradeChips">
      <span class="chip on" data-g="all">全部</span>
      <span class="chip s" data-g="S">S级</span>
      <span class="chip a" data-g="A">A级</span>
      <span class="chip" data-g="B">B级</span>
    </div>
    <div class="chip-row" id="statusChips">
      <span class="chip on" data-s="all">全部状态</span>
      <span class="chip" data-s="未投">未投递</span>
      <span class="chip" data-s="已投">已投递</span>
      <span class="chip" data-s="面试">待面试</span>
    </div>
    <div class="chip-row" id="cityChips">
      <span class="chip on" data-c="all">全部城市</span>
      <span class="chip" data-c="广州">广州</span>
      <span class="chip" data-c="深圳">深圳</span>
    </div>
    <input class="search" id="search" placeholder="搜索公司 / 岗位 / 关键词…" />
  </div>

  <div class="list" id="list"></div>
  <div class="empty" id="empty" style="display:none">没有匹配的岗位，换个筛选条件试试 🔍</div>

  <div class="push-bar" id="pushBar">
    <div class="t">开启浏览器通知，<b>有新的匹配岗位时</b>手机自动提醒你</div>
    <button class="push-btn" onclick="enablePush()">开启推送</button>
  </div>

  <div class="foot">秋招雷达 · 仅汇总公开招聘信息，投递请以企业官方校招官网为准<br/>数据由 WorkBuddy 每日 10:03 自动收集并评级</div>
</div>

<script>
let DATA = {jobs:[], stats:{}, lastUpdated:""};
let F = {g:"all", s:"all", c:"all", q:""};

async function load(manual){
  try{
    const r = await fetch("data.json?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error("http "+r.status);
    DATA = await r.json();
  }catch(e){
    if(manual) alert("加载失败，请检查网络后重试");
    document.getElementById("updated").textContent = DATA.lastUpdated || "离线";
    return;
  }
  render();
  notifyIfNew(manual);
}

function render(){
  document.getElementById("updated").textContent = DATA.lastUpdated || "—";
  const st = DATA.stats || {};
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="n">${st.total||0}</div><div class="l">总数</div></div>
    <div class="stat s"><div class="n">${st.sUntouched||0}</div><div class="l">S级未投</div></div>
    <div class="stat ok"><div class="n">${st.applied||0}</div><div class="l">已投递</div></div>
    <div class="stat"><div class="n">${st.interview||0}</div><div class="l">待面试</div></div>`;
  const q = F.q.trim().toLowerCase();
  const list = DATA.jobs.filter(j=>{
    if(F.g!=="all" && j.grade!==F.g) return false;
    if(F.s!=="all" && j.status!==F.s) return false;
    if(F.c!=="all" && !j.city.includes(F.c)) return false;
    if(q && !(j.company+q).toLowerCase().includes(q) && !(j.role+q).toLowerCase().includes(q) && !(j.reason+q).toLowerCase().includes(q)) return false;
    return true;
  });
  const el = document.getElementById("list");
  document.getElementById("empty").style.display = list.length? "none":"block";
  el.innerHTML = list.map((j,i)=>`
    <div class="card ${j.grade.toLowerCase()}">
      <div class="c-head">
        <div class="c-company">${esc(j.company)}</div>
        <span class="badge ${j.grade.toLowerCase()}">${j.grade}级</span>
      </div>
      <div class="c-role">${esc(j.role)} <span class="status-tag st-${j.status}">${j.status}</span></div>
      <div class="c-meta">📍 ${esc(j.city)} ｜ ${esc(j.type)} ｜ ${esc(j.year)}<br/>⏰ 截止：${esc(j.deadline)}</div>
      <div class="c-reason" id="r${i}">💡 ${esc(j.reason)}</div>
      <div class="c-actions">
        <button class="btn reason" onclick="toggle('r${i}')">适配理由</button>
        <a class="btn link" href="${esc(j.link)}" target="_blank" rel="noopener">去投递 →</a>
      </div>
    </div>`).join("");
  if(manual) window.scrollTo({top:0,behavior:"smooth"});
}

function toggle(id){ document.getElementById(id).classList.toggle("show"); }
function esc(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function notifyIfNew(manual){
  const key="qz_last";
  const prev = localStorage.getItem(key) || "";
  const cur = DATA.lastUpdated || "";
  if(cur && cur > prev){
    const s = DATA.stats||{};
    const msg = `秋招雷达更新：${s.total||0} 个岗位，其中 S级未投 ${s.sUntouched||0} 个`;
    if("Notification" in window && Notification.permission==="granted"){
      try{ new Notification("📡 秋招雷达",{body:msg}); }catch(e){}
    }
  }
  localStorage.setItem(key, cur);
}

function enablePush(){
  if(!("Notification" in window)){ alert("当前浏览器不支持通知"); return; }
  Notification.requestPermission().then(p=>{
    if(p==="granted"){ alert("已开启 ✅ 以后打开本工作台即可收到新岗位提醒"); new Notification("📡 秋招雷达",{body:"推送已开启，新岗位会在这里提醒你"}); }
    else alert("未授权，可在浏览器设置里手动开启");
  });
}

document.getElementById("gradeChips").onclick = e=>{
  if(!e.target.dataset.g) return;
  [...e.currentTarget.children].forEach(c=>c.classList.remove("on"));
  e.target.classList.add("on"); F.g=e.target.dataset.g; render();
};
document.getElementById("statusChips").onclick = e=>{
  if(!e.target.dataset.s) return;
  [...e.currentTarget.children].forEach(c=>c.classList.remove("on"));
  e.target.classList.add("on"); F.s=e.target.dataset.s; render();
};
document.getElementById("cityChips").onclick = e=>{
  if(!e.target.dataset.c) return;
  [...e.currentTarget.children].forEach(c=>c.classList.remove("on"));
  e.target.classList.add("on"); F.c=e.target.dataset.c; render();
};
document.getElementById("search").oninput = e=>{ F.q=e.target.value; render(); };

if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
load(false);
</script>
</body>
</html>
